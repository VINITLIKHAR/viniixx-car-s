<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#69D2E7">
  <title>Admin Login | Vinixx</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="login-page">
  <section class="login-card">
    <img src="assets/img/logo.png" alt="Vinixx" class="login-logo">
    <div class="eyebrow" style="text-align:center">Admin Panel</div>
    <h2>Sign in</h2>
    <form action="dashboard.html">
      <div class="form-grid" style="grid-template-columns:1fr">
        <div><label>Email or Mobile</label><input type="text" required value="admin@vinixx.com"></div>
        <div><label>Password</label><input type="password" required value="demo1234"></div>
      </div>
      <button class="btn" type="submit" style="margin-top:16px;width:100%">Sign in</button>
    </form>
  </section>
</body>
</html>
